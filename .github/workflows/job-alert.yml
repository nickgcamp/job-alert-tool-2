name: job-alert

on:
  schedule:
    # Every hour at :17 (GitHub runs cron in UTC and may start a few minutes late).
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The "seen jobs" SQLite file lives in the Actions cache between runs, so it never
      # lands in the public repo. Each run restores the newest copy and saves a new one.
      - name: Restore seen-jobs database
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Check job boards
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m job_alert run

      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
